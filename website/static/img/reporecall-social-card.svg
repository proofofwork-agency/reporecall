<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Reporecall — code context with a Trust Contract</title>
  <desc id="description">A dark telemetry-style card showing a prompt flowing through Reporecall into grounded context.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c14"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="18%" r="62%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e8eef6" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(72 68)">
    <g aria-hidden="true">
      <rect width="48" height="48" rx="12" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <path d="M14 16h20M14 24h12M14 32h16" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="66" y="34" fill="#e8eef6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">reporecall</text>
  </g>

  <g transform="translate(72 178)">
    <text fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2.5">LOCAL-FIRST CODE CONTEXT</text>
    <text y="74" fill="#e8eef6" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="720" letter-spacing="-1.8">Right evidence.</text>
    <text y="138" fill="#e8eef6" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="720" letter-spacing="-1.8">Before the model thinks.</text>
    <text y="190" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23">Auto-injected context · intent routing · explicit freshness</text>
  </g>

  <g transform="translate(72 442)" filter="url(#shadow)">
    <rect width="1056" height="120" rx="18" fill="#0d1420" stroke="#e8eef6" stroke-opacity="0.12"/>
    <g transform="translate(26 24)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="24" fill="#2dd4bf" font-size="15" font-weight="700">PROMPT</text>
      <text x="0" y="52" fill="#e8eef6" font-size="17">why does the auth callback loop?</text>
    </g>
    <path d="M390 60h72" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="m453 52 10 8-10 8" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <g transform="translate(492 24)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="24" fill="#2dd4bf" font-size="15" font-weight="700">ROUTE · RETRIEVE · ASSEMBLE</text>
      <text x="0" y="52" fill="#94a3b8" font-size="17">metadata · FTS · vectors · graph</text>
    </g>
    <g transform="translate(875 26)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="153" height="66" rx="12" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.65"/>
      <circle cx="22" cy="22" r="5" fill="#2dd4bf"/>
      <text x="36" y="27" fill="#5eead4" font-size="15" font-weight="700">FRESH</text>
      <text x="16" y="51" fill="#94a3b8" font-size="12">Trust Contract</text>
    </g>
  </g>
</svg>
