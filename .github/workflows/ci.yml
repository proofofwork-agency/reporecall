name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality (Ubuntu / Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, "lts/*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # test/integration/multilang-pipeline.test.ts loads tree-sitter WASM
      # grammars for every supported language. Vitest reuses worker processes
      # across files and WASM memory is not released with the module registry,
      # so on Node 24 that file tips an already-loaded worker over with "Fatal
      # process out of memory: Zone". Give it a fresh process of its own; both
      # steps together still run the whole suite, and the split costs no
      # coverage (the file exercises paths already covered elsewhere).
      - run: npm run coverage -- --exclude 'test/integration/multilang-pipeline.test.ts'
      - run: npx vitest run test/integration/multilang-pipeline.test.ts
      - run: npm run build
      - run: npm run smoke
      - run: npm run quality:check
      - run: npm run quality:claims
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run

  native:
    name: Native + packed demo (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, "lts/*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Load native dependencies
        run: node -e "require('better-sqlite3'); require('@lancedb/lancedb')"
      - run: npm run build
      - run: npm run demo:packed
