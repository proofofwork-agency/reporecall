name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality (Ubuntu / Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, "lts/*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Two suites load tree-sitter WASM grammars for every supported language.
      # Vitest reuses worker processes across files and WASM memory is not
      # released with the module registry, so on Node 24 whichever of them lands
      # on an already-loaded worker dies with "Fatal process out of memory:
      # Zone" (excluding only one just moved the failure to the other). Run both
      # in a fresh process. The two steps together still run the whole suite,
      # and the split costs no coverage — they exercise paths covered elsewhere.
      - run: |
          npm run coverage -- \
            --exclude 'test/integration/multilang-pipeline.test.ts' \
            --exclude 'test/parser/multilang-chunker.test.ts'
      - run: npx vitest run test/integration/multilang-pipeline.test.ts test/parser/multilang-chunker.test.ts
      - run: npm run build
      - run: npm run smoke
      - run: npm run quality:check
      - run: npm run quality:claims
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run

  native:
    name: Native + packed demo (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, "lts/*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Load native dependencies
        run: node -e "require('better-sqlite3'); require('@lancedb/lancedb')"
      - run: npm run build
      - run: npm run demo:packed
